[project]
name = "quantum-computing-practice"
version = "0.1.0"
description = "A Python web tutorial for simulating beginner quantum algorithms with Qiskit Aer."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "qiskit>=2.0",
    "qiskit-aer>=0.17",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
